name: Verify Jan Suvidha Kendra

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "server/**"
      - "firestore.rules"
      - ".github/workflows/verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "server/**"
      - "firestore.rules"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

concurrency:
  group: jsk-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile:
    name: Mobile clean install and Android bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # npm install first reconciles the committed lockfile with package.json.
      # npm ci then proves the reconciled lockfile supports a reproducible clean install.
      - name: Reconcile mobile lockfile
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify clean mobile install
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Validate Expo project configuration and dependencies
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Export Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android

  server:
    name: Server dependency and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reconcile server lockfile
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Apply compatible server security fixes
        working-directory: server
        run: npm audit fix --package-lock-only --no-fund

      - name: Verify clean server install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Check server JavaScript syntax
        working-directory: server
        run: |
          node --check server.js
          node --check scripts/set-staff-claim.cjs
          node --check scripts/remove-staff-claim.cjs

  dependency-audit:
    name: Report production dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Report mobile production advisories
        working-directory: mobile
        run: |
          npm audit --omit=dev --json > mobile-audit.json || true
          node -e "const r=require('./mobile-audit.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities || {}, null, 2)); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url,range:x.range,severity:x.severity,source:x.source}))}));"

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Report server production advisories
        working-directory: server
        run: |
          npm audit --omit=dev --json > server-audit.json || true
          node -e "const r=require('./server-audit.json'); console.log(JSON.stringify(r.metadata?.vulnerabilities || {}, null, 2)); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url,range:x.range,severity:x.severity,source:x.source}))}));"

  refresh-lockfiles:
    name: Commit reconciled npm lockfiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mobile, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible server security fixes
        working-directory: server
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Commit lockfile updates when needed
        run: |
          if ! git diff --quiet -- mobile/package-lock.json server/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add mobile/package-lock.json server/package-lock.json
            git commit -m "chore: synchronize npm lockfiles"

            # Another update can reach main while CI is generating lockfiles.
            # Rebase our lockfile-only commit before pushing; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase lockfile commit onto latest main." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Lockfile push attempt ${attempt} was rejected; retrying after fetching main."
              sleep 2
            done

            echo "Could not push lockfile sync after 3 attempts." >&2
            exit 1
          else
            echo "npm lockfiles already match package manifests."
          fi
